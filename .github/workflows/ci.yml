name: Choose Ghar & PG Saathi AI — Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-dummy-high-entropy-secret-key-32-chars-min"
      SECRET: "ci-dummy-high-entropy-secret-key-32-chars-min"
      NODE_ENV: "test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify TypeScript Compilation
        run: npx tsc --noEmit

      - name: Run ESLint Code Style Checks
        run: npm run check-lint

      - name: Run Voice AI & Security Unit Tests
        run: |
          npx tsx src/__tests__/voice_room_queries.test.ts
          npx tsx src/__tests__/security.test.ts

      - name: Verify Production Next.js Build
        run: npm run build
